name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orders-service:
    name: orders-service (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lockfile is in sync
        run: uv lock --check
        # --locked above already fails on a stale lockfile, so this is really
        # a clearer error message: "your uv.lock does not match pyproject.toml,
        # run 'uv lock' and commit the result".

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy strict)
        run: uv run mypy

      - name: Dependency check
        run: uv run deptry .

      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Enforce coverage
        run: |
          uv run coverage report --fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orders-service
          path: orders-service/coverage.xml
          if-no-files-found: error

  repository:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if git ls-files | grep -qE '\.env$'; then
            echo "::error::A .env file is committed. Only .env.example belongs in git."
            exit 1
          fi
          echo "No .env file is committed."