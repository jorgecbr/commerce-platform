name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orders-service:
    name: orders-service (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Dependency check
        run: uv run deptry .

      - name: Start infrastructure
        run: |
          docker compose up -d postgres redis kafka
          docker compose ps --format json | jq -r 'select(.Health != "" and .Health != "healthy") | .Name' \
            || true
          # Wait for the healthchecks rather than sleeping a fixed amount.
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" commerce-platform-postgres-1)" = "healthy" ]; do sleep 2; done'
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" commerce-platform-kafka-1)" = "healthy" ]; do sleep 2; done'

      - name: Migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_DSN: postgresql://orders:orders@localhost:5432/orders

      - name: Test
        run: |
          uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
        env:
          TEST_DATABASE_DSN: postgresql+psycopg://orders:orders@localhost:5432/orders
          TEST_KAFKA_BOOTSTRAP: localhost:29092

      - name: Enforce coverage
        run: uv run coverage report --fail-under=85

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orders-service
          path: orders-service/coverage.xml
          if-no-files-found: error

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

  inventory-service:
    name: inventory-service (java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with tests
        run: mvn -B verify

      - name: Store the jar
        uses: actions/upload-artifact@v4
        with:
          name: inventory-service-jar
          path: inventory-service/target/*.jar
          if-no-files-found: error

  repository:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if git ls-files | grep -qE '\.env$'; then
            echo "::error::A .env file is committed. Only .env.example belongs in git."
            exit 1
          fi
          echo "No .env file is committed."

      - name: Outbox migration and schema agree
        run: |
          # The first migration is hand written, so a column added to tables.py
          # and forgotten in the migration would only show up at runtime.
          if ! grep -q "processed_messages" inventory-service/src/main/resources/db/migration/V1__initial_schema.sql; then
            echo "::error::inventory-service migration looks out of date"
            exit 1
          fi
          echo "Migrations present."