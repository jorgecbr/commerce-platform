name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orders-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Dependency check
        run: uv run deptry .

  tests:
    name: unit and integration tests
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: orders-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Start infrastructure
        run: |
          docker compose up -d postgres redis kafka
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" commerce-platform-postgres-1)" = "healthy" ]; do sleep 2; done'
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" commerce-platform-kafka-1)" = "healthy" ]; do sleep 2; done'
          timeout 120 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" commerce-platform-redis-1)" = "healthy" ]; do sleep 2; done'

      - name: Migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_DSN: postgresql://orders:orders@localhost:5432/orders

      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
        env:
          TEST_DATABASE_DSN: postgresql+psycopg://orders:orders@localhost:5432/orders
          TEST_KAFKA_BOOTSTRAP: localhost:29092
          TEST_REDIS_URL: redis://localhost:6379/1

      - name: Enforce coverage
        run: uv run coverage report --fail-under=85

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-orders-service
          path: orders-service/coverage.xml
          if-no-files-found: error

  inventory-unit-tests:
    name: inventory-service (java)
    runs-on: ubuntu-latest
    needs: quality
    defaults:
      run:
        working-directory: inventory-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with tests
        run: mvn -B verify

  saga:
    name: saga end-to-end
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      # The real proof. Every unit test in this repository passed while
      # order.placed omitted its lines, the inventory service reserved nothing
      # and the saga confirmed the order anyway. That bug only exists in the
      # gap between the two services, so it needs a test that crosses it.
      - name: Build the images
        run: docker compose build orders-service inventory-service

      - name: Start infrastructure and wait for it
        run: |
          docker compose up -d postgres redis kafka
          # The variable must be expanded by THIS shell. Escaping it would
          # hand the inner shell a literal ${service} that it cannot resolve,
          # and the loop would wait forever on a container that does not exist.
          for service in postgres redis kafka; do
            container="commerce-platform-${service}-1"
            timeout 300 bash -c "until [ \"\$(docker inspect -f '{{.State.Health.Status}}' $container)\" = healthy ]; do sleep 3; done"
          done
          # The databases only exist after the init script has run.
          timeout 120 bash -c 'until docker compose exec -T postgres psql -U orders -d postgres -tAc "select 1 from pg_database where datname='\''orders'\''" | grep -q 1; do sleep 3; done'

      - name: Apply migrations
        # 'compose run' starts a throwaway container for the command, so the
        # schema exists before the long-running services come up. 'exec' would
        # need the service already running, which is exactly what we are
        # avoiding.
        run: docker compose run --rm --no-deps orders-service alembic upgrade head

      - name: Start the services
        run: docker compose up -d orders-service orders-worker inventory-service

      - name: Wait for every service
        run: |
          timeout 300 bash -c 'until curl -fsS http://localhost:8000/health/live >/dev/null; do sleep 3; done'
          # inventory-service runs Flyway on boot; wait for it to finish.
          timeout 300 bash -c 'until docker compose exec -T postgres psql -U orders -d inventory -tAc "select 1 from stock_items limit 1" >/dev/null 2>&1; do sleep 3; done'

      - name: Verify the saga
        run: ./scripts/verify_saga.sh

      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose exec -T postgres psql -U orders -d orders -c 'select * from orders'
          docker compose exec -T postgres psql -U orders -d inventory -c 'select * from stock_items'

  repository:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if git ls-files | grep -qE '\.env$'; then
            echo "::error::A .env file is committed. Only .env.example belongs in git."
            exit 1
          fi
          echo "No .env file is committed."

      - name: Inventory schema is migrated and versioned
        run: |
          if ! grep -q "CREATE TABLE stock_items" \
               inventory-service/src/main/resources/db/migration/V1__initial_schema.sql; then
            echo "::error::stock_items has no migration"
            exit 1
          fi
          if ! grep -q "version" \
               inventory-service/src/main/resources/db/migration/V1__initial_schema.sql; then
            echo "::error::stock_items is missing its version column"
            exit 1
          fi
          echo "Inventory migrations present."

      - name: Every built service has a Dockerfile
        run: |
          for service in orders-service inventory-service; do
            if [ ! -f "$service/Dockerfile" ]; then
              echo "::error::$service has no Dockerfile but docker-compose builds it"
              exit 1
            fi
          done
          echo "Every built service has a Dockerfile."

      - name: The saga check exists and is executable
        run: |
          if [ ! -x scripts/verify_saga.sh ]; then
            echo "::error::scripts/verify_saga.sh must be executable and is what CI relies on"
            exit 1
          fi
          echo "Saga verification present."