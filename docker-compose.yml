name: commerce-platform

services:
  postgres:
    image: postgres:17-alpine
    # The default 64 MB of shared memory is not enough for PostgreSQL to
    # checkpoint and shut down cleanly after running its init scripts on a
    # constrained machine, and the entrypoint aborts the whole boot when that
    # fails. 256 MB removes the failure mode.
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - orders_pg:/var/lib/postgresql/data
      # Creates one database per service on first boot.
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders} -d ${POSTGRES_DB:-orders}"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  kafka:
    # Official Apache image in KRaft mode: the broker is also the controller,
    # so there is no ZooKeeper to run. Two listeners, because a client on the
    # host and a client inside the compose network need different advertised
    # addresses.
    image: apache/kafka:3.9.0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - orders_kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  orders-service:
    build:
      context: ./orders-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Names must match the flat settings in app/config.py.
      DATABASE_DSN: postgresql://orders:orders@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8000:8000"

  # The outbox relay and the saga consumer run in their own service, not in
  # the API. A request that waits for Kafka inherits its latency, so a broker
  # outage would become an API outage. Here it only delays the next poll.
  orders-worker:
    build:
      context: ./orders-service
    command: ["python", "-m", "app.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_DSN: postgresql://orders:orders@postgres:5432/orders
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    restart: on-failure

  inventory-service:
    build:
      context: ./inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # JDBC has no user:password@ form; credentials go in their own properties.
      DATABASE_URL: jdbc:postgresql://postgres:5432/inventory
      DATABASE_USER: orders
      DATABASE_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  orders_pg:
  orders_kafka: